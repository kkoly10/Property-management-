name: Materialize Crecy v4 specs

on:
  push:
    branches:
      - agent/add-crecy-v4-gate0

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize authoritative package
        run: |
          if [[ -f .crecy-bootstrap/READY && ! -f docs/crecy-v4/00_READ_ME_FIRST.md ]]; then
            bash scripts/materialize-crecy-v4.sh
          else
            echo "Bootstrap is not ready or package is already materialized."
          fi

      - name: Commit materialized package
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Crecy v4 Gate 0 package"
          git push
