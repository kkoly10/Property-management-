# LocalSocket and TemporaryDirectory are supplied by entrypoint.py.
DatabaseDirectory /var/lib/clamav
Foreground yes
LocalSocketMode 600
FixStaleSocket yes
ConcurrentDatabaseReload no
SelfCheck 600
LogClean no
LeaveTemporaryFiles no
OfficialDatabaseOnly yes

# Keep scanning in-process. Do not parse mail or inspect URLs for phishing.
ScanMail no
ScanPartialMessages no
PhishingScanURLs no
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no

# Limit the stream, each scanned file and total unpacked bytes per submission.
StreamMaxLength 50M
MaxFileSize 50M
MaxScanSize 160M
MaxScanTime 15000
MaxRecursion 12
MaxFiles 10000
MaxThreads 3
MaxQueue 8
MaxConnectionQueueLength 8
CommandReadTimeout 5
ReadTimeout 15
SendBufTimeout 1000
